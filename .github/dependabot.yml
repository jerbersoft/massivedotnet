version: 2

# Keeps the actions in .github/workflows/ current.
#
# Every `uses:` names a full commit SHA, with the release it was cut from as a trailing comment:
# `uses: actions/checkout@<40 hex digits> # v7.0.1`. A tag such as `@v7` is not a version. It is a
# pointer, resolved fresh on every run, to whatever commit that tag names today -- so the reference
# is a standing trust in the tag's owner rather than a decision taken once. The SHA is that
# decision, and this file is what keeps it from being a version frozen together with its bugs: the
# updater rewrites the SHA and the comment together, so the comment is how a reviewer reads which
# release a pin is. A new `uses:` takes the same form; Semgrep flags a bare tag.
#
# A new release waits out a seven-day cooldown before it is proposed. A hijacked release is usually
# caught and pulled within days, and it is the one thing a pin cannot defend against, since the SHA
# is taken from the release itself. The cooldown holds back version updates only; a security update
# for an advisory is not delayed.
#
# Minor and patch updates arrive grouped in a single pull request. Separately they are noise, and a
# solo maintainer handed six near-identical pull requests reviews none of them.
#
# Majors are deliberately NOT grouped. A major action bump can move the runner's Node version or
# drop an input, and it should fail on a pull request of its own, where the red check names the
# action that broke it rather than four innocent ones alongside it.
#
# NuGet is deliberately absent. Advisories against a package, direct or transitive, already fail
# the build: NuGetAudit is on by default and TreatWarningsAsErrors (rule 9) covers the NU19xx codes
# it raises, so a newly published advisory breaks CI rather than adding a pull request nobody
# reads. Version bumps that are not advisories are a constitution question here (rule 7 caps core
# at two packages), not something to automate.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions:
        patterns: ['*']
        update-types: [minor, patch]
