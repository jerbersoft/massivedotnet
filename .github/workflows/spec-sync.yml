name: spec-sync

# Massive regenerates its OpenAPI description continuously. This job notices changes and
# opens a PR, so upstream API drift arrives as a reviewable diff rather than a surprise.
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: Open a pull request even when the spec is unchanged, to exercise the path.
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  # The fallback that makes a refused pull request visible opens an issue, and that needs its own
  # scope. Without it the fallback dies with "Resource not accessible by integration (createIssue)"
  # -- the blocked sync going unseen a second way, which is the whole of #45.
  issues: write

jobs:
  sync:
    name: check upstream spec
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Fetch and normalize
        run: |
          curl -fsSL https://api.massive.com/openapi -o /tmp/openapi.raw.json

          # Upstream key ordering is unstable (constitution D10). Normalizing keeps the diff
          # limited to genuine API changes instead of 20k lines of reordering.
          python3 -c "
          import json
          spec = json.load(open('/tmp/openapi.raw.json'))
          json.dump(spec, open('specs/openapi.json', 'w'), indent=2, sort_keys=True)
          "

      - name: Detect changes
        id: diff
        # The pull request path runs only when upstream actually drifts, which is why it went
        # three nights unexercised (#45). The force input runs it on demand against an unchanged
        # spec, so the mechanism can be proven before the drift it exists to report arrives.
        env:
          FORCE: ${{ inputs.force }}
        run: |
          if ! git diff --quiet -- specs/openapi.json; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --stat -- specs/openapi.json
          elif [ "$FORCE" = "true" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "forced=true" >> "$GITHUB_OUTPUT"
            echo "No upstream changes; forced, so the pull request path runs anyway."
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No upstream changes."
          fi

      - name: Summarize operation changes
        if: steps.diff.outputs.changed == 'true'
        id: summary
        run: |
          git show HEAD:specs/openapi.json > /tmp/previous.json
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json

          def operations(path):
              spec = json.load(open(path))
              return {
                  item['get']['operationId']: name
                  for name, item in spec['paths'].items()
                  if 'get' in item and 'operationId' in item['get']
              }

          before, after = operations('/tmp/previous.json'), operations('specs/openapi.json')
          added, removed = set(after) - set(before), set(before) - set(after)

          print(f"## Spec sync\n\n{len(before)} -> {len(after)} operations\n")
          for label, ids, source in (("Added", added, after), ("Removed", removed, before)):
              if ids:
                  print(f"### {label} ({len(ids)})\n")
                  for i in sorted(ids):
                      print(f"- `{i}` — `{source[i]}`")
                  print()
          PY

      - name: Regenerate and verify
        if: steps.diff.outputs.changed == 'true'
        id: regen
        # A spec change can invalidate the generated code. Surface that in the PR rather
        # than letting it fail later on someone else's branch. continue-on-error reports
        # this step's conclusion as success either way, so the outcome is recorded in an
        # output the PR body reads: without it the body can only guess, and it guessed wrong.
        continue-on-error: true
        run: |
          fail() {
            echo "status=$1" >> "$GITHUB_OUTPUT"
            echo "::error::$2"
            exit 1
          }

          dotnet run --project tools/MassiveDotNet.CodeGen \
            || fail generator "The generator failed on the new spec."

          # Constitution rule 6: same inputs, byte-identical output. The build job proves that
          # against an unchanged spec; a new spec is the input where non-determinism would first
          # appear, and it is the one input no other job ever sees. Staging the first run makes
          # the index the baseline the second must reproduce exactly.
          git add src/
          dotnet run --project tools/MassiveDotNet.CodeGen \
            || fail generator "The generator failed on its second run over the new spec."
          git diff --exit-code --quiet -- src/ \
            || fail nondeterministic "Two runs over the same spec disagreed (rule 6)."

          dotnet build MassiveDotNet.slnx -c Release \
            || fail build "The regenerated tree does not compile."

          echo "status=ok" >> "$GITHUB_OUTPUT"

      - name: Open pull request
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGEN_STATUS: ${{ steps.regen.outputs.status }}
          FORCED: ${{ steps.diff.outputs.forced }}
        run: |
          today="$(date -u +%Y-%m-%d)"
          branch="spec-sync/$today"

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Keyed on the pull request, not the branch. A run that pushed its branch and then
          # failed to open the PR leaves the branch behind looking complete, so keying on the
          # branch made re-running that day -- the one action that repairs it -- a no-op that
          # reported success (#45).
          if [ -n "$(gh pr list --head "$branch" --state open --json number --jq '.[].number')" ]; then
            echo "A pull request is already open for $branch; nothing to do."
            exit 0
          fi

          # What the PR says about generated code, and whether it carries any, both follow from
          # one status. An unset status means the step did not reach its own reporting, so it
          # falls through to the untrusted branch rather than being read as success.
          case "$REGEN_STATUS" in
            ok)
              trust_src=yes
              warn=""
              note="Generated code was refreshed alongside the spec: the generator ran clean, ran
          again to the same bytes, and the solution builds."
              ;;
            build)
              trust_src=yes
              warn="build failed"
              note="**The regenerated tree does not compile.** Generated code is included because it
          is what needs review: the spec change is the likely cause, and the build log in the
          workflow run says where. Do not merge this until it builds."
              ;;
            nondeterministic)
              trust_src=no
              warn="generator is non-deterministic"
              note="**Two generator runs over this spec produced different output**, which violates
          constitution rule 6. Generated code is deliberately left out of this PR, because
          neither run can be trusted as the one to review. This is a generator bug, not a
          spec problem: reproduce with two consecutive runs over the spec below."
              ;;
            *)
              trust_src=no
              warn="generator failed"
              note="**The generator failed on this spec, so no generated code accompanies it.** The
          spec change travels alone and \`src/\` is untouched. The workflow run holds the
          generator output. Regeneration is required before this can merge."
              ;;
          esac

          # A half-written or untrustworthy src/ must not reach the commit. Restoring from HEAD
          # rather than skipping the add also undoes whatever the failed run left behind.
          if [ "$trust_src" != "yes" ]; then
            git restore --source=HEAD --staged --worktree -- src/
          fi

          git checkout -b "$branch"
          git add specs/openapi.json src/

          # A forced run has nothing to commit by definition: it exists to exercise this path
          # against an unchanged spec, so the empty commit is the point rather than a mistake.
          if [ "$FORCED" = "true" ]; then
            git commit --allow-empty -m "chore: sync OpenAPI description from api.massive.com"
            note="**This is a self-test of the sync, not a sync. Close it; do not merge it.** It was
          dispatched with \`force\` to prove the pull request path works while upstream is
          unchanged, so its diff is deliberately empty. $note"
            title="[do not merge] spec-sync self-test ($today)"
          else
            git commit -m "chore: sync OpenAPI description from api.massive.com"

            if [ -n "$warn" ]; then
              title="[warning] chore: sync OpenAPI description ($today) - $warn"
            else
              title="chore: sync OpenAPI description ($today)"
            fi
          fi

          cat > /tmp/pr-body.md <<BODY
          Automated sync from \`https://api.massive.com/openapi\`.

          $note

          Review the operation summary in the workflow run, then check whether
          \`specs/endpoints.map.json\` needs new rows for any added operations - coverage is
          enforced by \`EndpointCoverageTests\`.
          BODY

          # Forcing is safe because the guard above established that no open pull request is
          # reviewing this branch, so anything already on it is an abandoned run's leftovers.
          git push --force origin "$branch"

          if gh pr create \
            --title "$title" \
            --body-file /tmp/pr-body.md \
            --label "area:codegen" \
            --base master \
            --head "$branch"
          then
            exit 0
          fi

          # The branch is pushed by now, so a refused pull request leaves the repository looking
          # like the sync worked -- exactly how #45 stayed invisible for three nights. The issue
          # puts the blockage where a human actually looks, and the step still fails.
          cat > /tmp/blocked-body.md <<BLOCKED
          The nightly spec sync pushed \`$branch\` but could not open a pull request for it, so the
          upstream diff is sitting on the remote with nothing pointing at it.

          Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID

          The usual cause is **Settings -> Actions -> General -> Workflow permissions -> "Allow
          GitHub Actions to create and approve pull requests"** being switched off, which is #45.
          Turn it back on, then re-run the workflow: the guard keys on the pull request, so a
          re-run opens one for the branch that is already there rather than skipping the day.
          BLOCKED

          # Reported from whether the issue was actually opened, not from having attempted it:
          # claiming an issue that does not exist is the failure this fallback exists to prevent.
          if gh issue create \
            --title "spec-sync could not open a pull request for $branch" \
            --body-file /tmp/blocked-body.md \
            --label "area:ci"
          then
            echo "::error::Pull request creation was refused for $branch; opened an issue instead."
          else
            echo "::error::Pull request creation was refused for $branch, and the fallback issue could not be opened either. Check the workflow's issues: write permission."
          fi

          exit 1
