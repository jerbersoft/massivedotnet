name: docs

# Builds the documentation site from docs/ and publishes it to
# https://jerbersoft.github.io/massivedotnet/ from master.
#
# Separate from ci.yml on the argument that it answers a different question and should fail with its own
# name. "docs / build the site" says a doc comment or a link stopped resolving; a red step inside ci.yml
# would say "ci failed" and send somebody to the test output.
#
# Pages is configured with `build_type: workflow`, so this workflow IS the source. There is no gh-pages
# branch and no committed _site -- the built site and the generated API YAML are gitignored, because a
# generated directory in version control is a merge conflict waiting for the next doc-comment fix.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    name: build the site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # global.json pins the SDK feature band, so the runner and a developer's machine resolve the same
      # compiler -- which matters here: DocFX reads the doc comments through the compiler it is given.
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # DocFX is pinned at 2.78.5 in .config/dotnet-tools.json with rollForward: false, so this restores
      # that exact version rather than whatever is newest. The site's layout and the generated YAML schema
      # are both version-dependent; an unpinned tool would redesign the published site on somebody else's
      # release schedule.
      - name: Restore DocFX
        run: dotnet tool restore

      # DocFX loads the four shipping projects through MSBuildWorkspace to read their doc comments, so
      # their dependencies have to be on disk first. docfx would restore them itself, but doing it here
      # means a restore failure is reported as a restore failure.
      - name: Restore projects
        run: dotnet restore MassiveDotNet.slnx

      # `docfx docs/docfx.json` -- not `docfx build` -- because that form runs the metadata stage as well.
      # It has to: docs/api/*.yml is gitignored, so on a fresh checkout the reference YAML does not exist
      # and `build` alone would publish a site with an empty API section.
      #
      # --warningsAsErrors matches constitution rule 9 in the build proper. A DocFX warning is almost
      # always a link that will not resolve -- a README section renamed, a page moved -- which on a
      # published site is a dead link nobody reports. Failing here is how it stays impossible to ship one.
      - name: Build the site
        run: dotnet docfx docs/docfx.json --warningsAsErrors

      - name: Upload the site
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/_site

  # Never from a pull request, and never from a branch. A fork's PR must not be able to publish to the live
  # site, and even a trusted branch should not: what is deployed is what landed on master.
  deploy:
    name: deploy to pages
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest

    permissions:
      pages: write       # to publish the deployment
      id-token: write    # for the OIDC token deploy-pages exchanges for one

    # One deployment at a time, and queued rather than cancelled. cancel-in-progress: true is the usual
    # choice and it is wrong for a deploy: killing a half-finished upload to leap to a newer commit can
    # leave the live site on neither. Two pushes a minute apart should publish in order.
    concurrency:
      group: pages
      cancel-in-progress: false

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
